[project]
name = "spatial-seq"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ethan H", email = "ethanhung11@gmail.com" }
]
dependencies = [
    "spatialdata>=0.5.0",
    "spatialdata-plot>=0.2.12",
    "spatialdata-io>=0.3.0",
    "napari-spatialdata>=0.5.6",
    "squidpy>=1.6.5",
    "scanpy>=1.11.4",
    "anndata>=0.12.2",
    "scvi-tools>=1.4.0.post1",
    "openpyxl>=3.1.5",
    "geosketch>=1.3",
    "pyqt5>=5.15.11",
    "pyproj==3.6.1",
    "harmonypy>=0.0.10",
    "doubletdetection>=4.3.0.post1",
    "decoupler>=2.1.1",
    "liana>=1.5.1",
    "bbknn>=1.6.0",
    "louvain==0.8.2",
    "cellcharter>=0.3.5",
    "tangram-sc>=1.0.4",
    "pydeseq2>=0.5.2",
    "gprofiler-official>=1.0.0",
    "pacmap==0.8.0",
    "pybiomart>=0.2.0",
    "plotly>=6.4.0",
    "plotnine>=0.15.0",
    "gseapy>=1.1.9",
    "glasbey>=0.3.0",
    "pyucell>=0.5.0",
    "commot>=0.0.3",
    "celltypist>=1.7.1",
    "scanorama>=1.7.4",
    "anndata2ri>=2.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_seq"]

[dependency-groups]
dev = [
    "itables>=2.5.2",
    "jupyter>=1.1.1",
    "nbqa[toolchain]>=1.9.1",
    "ruff>=0.14.0",
]
