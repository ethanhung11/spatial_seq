[project]
name = "spatial-seq"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ethan H", email = "ethanhung11@gmail.com" }
]
dependencies = [
    "tqdm>=4.67.1",
    "scikit-image>=0.25.2",
    "seaborn>=0.13.2",
    "pacmap==0.8.0",
    "glasbey>=0.3.0",
    "openpyxl>=3.1.5",
    "geosketch>=1.3",
    "anndata>=0.12.2",
    "scanpy>=1.11.4",
    "rpy2>=3.6.1",
    "anndata2ri>=1.3.2",
    "harmonypy>=0.0.10",
    "doubletdetection>=4.3.0.post1",
    "plotnine>=0.15.0",
    "scvi>=0.6.8",
    "decoupler>=2.1.1",
    "liana>=1.5.1",
    "tangram-sc>=1.0.4",
    "pydeseq2>=0.5.2",
    "gprofiler-official>=1.0.0",
    "gseapy>=1.1.9",
    "squidpy>=1.6.5",
    "spatialdata>=0.4.0",
    "spatialdata-plot>=0.2.12",
    "spatialdata-io>=0.3.0",
    "napari-spatialdata>=0.5.6",
    "pyqt5>=5.15.11",
    "louvain>=0.8.2",
    "pydantic>=2.11.9",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "black[jupyter]>=25.1.0",
    "itables>=2.4.4",
    "notebook>=7.4.4",
    "jupyter>=1.1.1",
    "jupyter-black>=0.4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_seq"]
